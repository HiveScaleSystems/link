name: release

# Push a tag like v0.2.0 (or run manually) to build the Hytale jar and publish it as a GitHub
# Release. Versions with a "-" (v0.2.0-beta.1) become pre-releases.
#
# The Hytale server API comes from the public maven.hytale.com repository, so no secrets are needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (created from the selected branch if it doesn't exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build -Pversion="$VERSION"

      - name: Collect jars
        run: |
          mkdir dist
          cp LinkHytale/build/libs/link-hytale-"$VERSION".jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -l dist

      - name: Write release notes header
        run: |
          hytale=$(sed -n 's/^val hytaleServerVersion = "\(.*\)"/\1/p' LinkHytale/build.gradle.kts)
          {
            echo "## Downloads"
            echo
            echo "| Platform | File | Install |"
            echo "|---|---|---|"
            echo "| Hytale | \`link-hytale-$VERSION.jar\` | \`mods/\` |"
            echo
            echo "Built against Hytale server \`$hytale\`. The Cloudflare registry deploys from"
            echo "\`cloudflare-registry/\` in this tag's source."
            echo
          } > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Link $VERSION" --notes-file notes.md --generate-notes --verify-tag)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" dist/* "${flags[@]}"

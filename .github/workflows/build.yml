name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: link
          path: LinkHytale/build/libs/*.jar

  cloudflare-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-registry
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-registry/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
